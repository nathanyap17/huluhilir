<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #F5F2ED; touch-action: none; }
  #status { position: fixed; bottom: 4px; left: 6px; color: #8A8A70; font-family: sans-serif; font-size: 9px; z-index: 10; opacity: 0.6; }
  /* Legend lives inside the scene rather than in the Flutter card above it,
     so it travels with the terrain on every platform -- the 2D fallback
     draws its own, and having only one of the two carry a legend was the
     inconsistency this fixes. */
  #legend {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,0.88); border: 1px solid #E4DFD5;
    border-radius: 10px; padding: 10px 12px;
    font-family: -apple-system, system-ui, sans-serif; font-size: 11px; color: #2D2D2D;
    pointer-events: none; line-height: 1.7;
  }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  #legend .flow { width: 14px; border-top: 2px dashed #8A8A70; flex: 0 0 auto; }
  #hint {
    position: fixed; bottom: 8px; right: 10px; z-index: 10;
    font-family: -apple-system, system-ui, sans-serif; font-size: 10px;
    color: #8A8A70; opacity: 0.75; pointer-events: none;
  }
</style>
</head>
<body>
<div id="status">init</div>
<div id="legend">
  <div class="row"><span class="dot" style="background:#CC7A5C"></span>Terjejas</div>
  <div class="row"><span class="dot" style="background:#EBC366"></span>Berisiko</div>
  <div class="row"><span class="dot" style="background:#5A5A40"></span>Selamat</div>
  <div class="row"><span class="flow"></span>Aliran hiliran</div>
</div>
<div id="hint">Tahan blok untuk lihat · lepas untuk tutup</div>
<!--
  Classic (non-module) Three.js r128 -- confirmed necessary on-device, see
  docs/BUILD_LOG.md "3D terrain viability spike". ES modules loaded via
  file:///android_asset/... are blocked by Chromium's CORS policy for module
  imports; plain <script> tags are not affected. Any future addon must come
  from examples/js/ (classic), never examples/jsm/ (ES module) for the same
  reason.
-->
<script src="./vendor/three.min.js"></script>
<script src="./vendor/OrbitControls.js"></script>
<script>
'use strict';
const statusEl = document.getElementById('status');
function setStatus(s) { statusEl.textContent = s; }

// ---- constants -------------------------------------------------------------
// Terrain is a stylised diorama, not a map: layout is driven by
// elevation_rank ordering only, never real lat/lon. Rendering real
// coordinates would imply the app holds land boundaries, which it explicitly
// never records (huluhilir-rules skill §4).
const PLANE_SIZE = 18;
const SEGMENTS = 100; // 150 in the original spec; reduced for mobile GPUs, still smooth
const STEP_HEIGHT = 0.28;
const MAX_HEIGHT = 3.0;
const ISLAND_RADIUS = 8.0;
const IDW_POWER = 3; // sharper falloff so each block's own height dominates near it, rather than blending flat

// Elevation colour ramp: base/water -> mid earth/sand -> high vegetation.
// Green throughout, lightening with height -- the way a real hillside reads,
// where ridges catch more sun and valley floors sit damp and shaded. The
// earlier white/cyan/orange ramp looked like desert terracing and gave the
// misleading impression that colour encoded risk; risk is carried by the
// vine pillars and the cross-section slabs, never by the ground.
const ELEVATION_STOPS = [
  [0.00, 0x33452B],
  [0.20, 0x3D5732],
  [0.42, 0x496839],
  [0.62, 0x577A42],
  [0.82, 0x668C4C],
  [1.00, 0x789F5B],
];

const STATE_COLOUR = {
  protected: 0x5A5A40, // olive -- "healthy" in the original spec's language
  alerted: 0xEBC366,   // yellow
  harmed: 0xCC7A5C,    // terracotta
  overrun: 0x8B3A2B,
};

let scene, camera, renderer, controls;
let terrainGroup, pillarGroup, linesGroup, selectionRing;
let pillarMeshes = []; // {mesh, blockId}
let raycaster;
let currentNodes = [];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xF5F2ED);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(11, 15, 16);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  // Restrict polar angle so the user cannot look under the map, and clamp
  // zoom distance (per spec §6).
  controls.maxPolarAngle = Math.PI / 2 - 0.08;
  controls.minPolarAngle = Math.PI / 6;
  // Wide zoom range: the previous 8-26 clamp was tight enough that pinching
  // felt like nothing happened. Close enough to inspect one block's
  // cross-section, far enough to see the whole catchment.
  controls.enableZoom = true;
  controls.zoomSpeed = 1.1;
  controls.minDistance = 3.5;
  controls.maxDistance = 60;
  controls.target.set(0, 1.0, -3.0);
  controls.update();

  scene.add(new THREE.AmbientLight(0xC9D8C0, 0.45));
  const sun = new THREE.DirectionalLight(0xFFF6E0, 0.95);
  sun.position.set(8, 14, 6);
  scene.add(sun);

  // Shadow-catcher ground plane beneath the terraced island.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0xF5F2ED, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);

  terrainGroup = new THREE.Group();
  pillarGroup = new THREE.Group();
  linesGroup = new THREE.Group();
  scene.add(terrainGroup, pillarGroup, linesGroup);

  raycaster = new THREE.Raycaster();
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerleave', onPointerLeave);
  renderer.domElement.addEventListener('pointercancel', onPointerLeave);
  window.addEventListener('resize', onResize);

  animate();
  setStatus('ready');
  // Announce readiness on BOTH transports. This used to be FlutterBridge
  // only, which does not exist inside an iframe -- so on web nothing told the
  // host the scene was alive, the host just blind-retried the payload eight
  // times over ~2.8s, and a slow iframe missed every one. The result was a
  // bare ground plane until the farmer left the dashboard and came back.
  // `post` is defined below but hoisted, so calling it here is fine.
  post('ready');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ---- IDW terrain generation -------------------------------------------------

function lerpColour(c1, c2, t) {
  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
  return [
    (r1 + (r2 - r1) * t) / 255,
    (g1 + (g2 - g1) * t) / 255,
    (b1 + (b2 - b1) * t) / 255,
  ];
}

function elevationColour(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < ELEVATION_STOPS.length - 1; i++) {
    const [t0, c0] = ELEVATION_STOPS[i];
    const [t1, c1] = ELEVATION_STOPS[i + 1];
    if (t >= t0 && t <= t1) {
      const localT = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
      return lerpColour(c0, c1, localT);
    }
  }
  return lerpColour(ELEVATION_STOPS.at(-1)[1], ELEVATION_STOPS.at(-1)[1], 0);
}

function idwHeight(x, z, samples) {
  let weightSum = 0, valueSum = 0;
  for (const s of samples) {
    const dx = x - s.x, dz = z - s.z;
    const dist2 = dx * dx + dz * dz;
    if (dist2 < 0.01) return s.height;
    const w = 1 / Math.pow(dist2, IDW_POWER / 2);
    weightSum += w;
    valueSum += w * s.height;
  }
  return weightSum > 0 ? valueSum / weightSum : 0;
}

function buildTerrain(samples) {
  const geo = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, SEGMENTS, SEGMENTS);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const colours = new Float32Array(pos.count * 3);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = samples.length ? idwHeight(x, z, samples) : 0;

    // Island tapering: force the outer edge of the plane down to 0 so the
    // terrain reads as a contained landform, not an infinite plane.
    const distFromCentre = Math.sqrt(x * x + z * z);
    if (distFromCentre > ISLAND_RADIUS) {
      const outer = PLANE_SIZE / 2;
      const t = Math.min(1, (distFromCentre - ISLAND_RADIUS) / (outer - ISLAND_RADIUS));
      h *= (1 - t);
    }

    // Terracing: quantize into discrete steps for the topographic-model look.
    const stepped = Math.floor(h / STEP_HEIGHT) * STEP_HEIGHT;
    pos.setY(i, stepped);

    const [r, g, b] = elevationColour(stepped / MAX_HEIGHT);
    colours[i * 3] = r; colours[i * 3 + 1] = g; colours[i * 3 + 2] = b;
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colours, 3));
  geo.computeBoundingBox();

  // Flat shading needs distinct vertices per face (no shared/averaged
  // normals across the quantized steps) -- non-indexed + recomputed normals.
  const flat = geo.toNonIndexed();
  flat.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    flatShading: true,
    roughness: 1.0,
  });

  return new THREE.Mesh(flat, material);
}

function heightAt(samples, x, z) {
  if (!samples.length) return 0;
  let h = idwHeight(x, z, samples);
  const distFromCentre = Math.sqrt(x * x + z * z);
  if (distFromCentre > ISLAND_RADIUS) {
    const outer = PLANE_SIZE / 2;
    const t = Math.min(1, (distFromCentre - ISLAND_RADIUS) / (outer - ISLAND_RADIUS));
    h *= (1 - t);
  }
  return Math.floor(h / STEP_HEIGHT) * STEP_HEIGHT;
}

// ---- vine pillars (data markers) -------------------------------------------

function makeLabelSprite(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const scale = 4;
  canvas.width = 256 * scale / 2;
  canvas.height = 64 * scale / 2;
  ctx.scale(scale / 2, scale / 2);
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(45,45,45,0.88)';
  const w = ctx.measureText(text).width + 20;
  const cx = 128, cy = 32;
  ctx.beginPath();
  ctx.roundRect(cx - w / 2, cy - 16, w, 32, 10);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, cx, cy + 1);

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(2.0, 0.5, 1);
  return sprite;
}

function buildVinePillar(node) {
  const group = new THREE.Group();
  const colour = STATE_COLOUR[node.currentState] ?? STATE_COLOUR.protected;

  // Cross-sectional core beneath the block: a semi-transparent column cut
  // down through the terrain, tinted by the block's condition. This reads
  // the way a soil core does, which is the right metaphor -- foot rot is a
  // SOIL-borne, water-driven disease, so a block's condition is a property
  // of the ground under it, not of the canopy above it. Depth is fixed
  // rather than scaled by risk: it is a cross-section, not a bar chart, and
  // varying its length would imply a magnitude the model does not claim.
  // Spans above the surface as well as below: a column that sat entirely
  // underground was completely occluded by the opaque terrain, leaving only
  // its top disc visible, which defeated the point of showing a section.
  const CORE_DEPTH = 2.4;
  const CORE_RISE = 0.5;
  const core = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, CORE_DEPTH + CORE_RISE, 24, 1, true),
    new THREE.MeshBasicMaterial({
      color: colour,
      transparent: true,
      opacity: 0.30,
      side: THREE.DoubleSide,
      depthWrite: false, // otherwise the column occludes the terrain behind it
    })
  );
  // Hangs below the surface the pillar stands on.
  core.position.y = CORE_RISE - (CORE_DEPTH + CORE_RISE) / 2;
  group.add(core);

  // Cap discs close the column at both ends so it reads as a solid sample
  // rather than an open tube when seen from above or below.
  for (const y of [CORE_RISE, -CORE_DEPTH]) {
    const cap = new THREE.Mesh(
      new THREE.CircleGeometry(0.5, 24),
      new THREE.MeshBasicMaterial({
        color: colour,
        transparent: true,
        opacity: 0.45,
        side: THREE.DoubleSide,
        depthWrite: false,
      })
    );
    cap.rotation.x = -Math.PI / 2;
    cap.position.y = y;
    group.add(cap);
  }

  // Wooden support post.
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.08, 1.1, 8),
    new THREE.MeshStandardMaterial({ color: 0x8D6E52, flatShading: true, roughness: 1 })
  );
  post.position.y = 0.55;
  group.add(post);

  // Low-poly foliage: 3 overlapping dodecahedrons.
  const foliageMat = new THREE.MeshStandardMaterial({ color: colour, flatShading: true, roughness: 1 });
  const offsets = [
    [0, 1.05, 0, 0.34],
    [0.16, 0.85, 0.1, 0.24],
    [-0.14, 0.8, -0.12, 0.22],
  ];
  const hitTargets = [];
  for (const [ox, oy, oz, r] of offsets) {
    const dodeca = new THREE.Mesh(new THREE.DodecahedronGeometry(r), foliageMat);
    dodeca.position.set(ox, oy, oz);
    group.add(dodeca);
    hitTargets.push(dodeca);
  }

  const label = makeLabelSprite(`${node.label} · #${node.elevationRank}`);
  label.position.y = 1.6;
  group.add(label);

  // Invisible, larger hit target -- the visible dodecahedrons are too small
  // a raycast target for a real fingertip (confirmed needing pixel-precise
  // taps during on-device testing before this was added).
  const hitSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 8, 8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitSphere.position.y = 0.9;
  group.add(hitSphere);
  hitTargets.push(hitSphere);

  return { group, hitTargets, post };
}

function buildSelectionRing() {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.62, 0.74, 32),
    new THREE.MeshBasicMaterial({ color: 0x2D2D2D, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ring.visible = false;
  return ring;
}

// ---- downhill flow vectors ---------------------------------------------------

function buildFlowLine(fromPos, toPos, weight, barrier) {
  const points = [
    new THREE.Vector3(fromPos.x, fromPos.y + 0.15, fromPos.z),
    new THREE.Vector3(toPos.x, toPos.y + 0.15, toPos.z),
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineDashedMaterial({
    color: barrier ? 0x9AA5AA : 0x3b82f6,
    transparent: true,
    opacity: barrier ? 0.35 : Math.max(0.35, weight),
    dashSize: 0.22,
    gapSize: 0.16,
    linewidth: 1,
  });
  const line = new THREE.Line(geo, material);
  line.computeLineDistances(); // required for LineDashedMaterial to render dashes
  return line;
}

// ---- selection / raycasting --------------------------------------------------
//
// Hover to peek, stop hovering to close. There is no X: the window closes
// itself when the pointer leaves the block.
//
// Touch screens have no hover, so "hands off the screen" is expressed as
// press-and-hold: holding a pillar peeks, releasing closes. That is the
// honest touch analogue of the same gesture, and the phone is the real
// product -- a mouse-only interaction would have made the terrain unusable
// on the device farmers actually hold.
//
// The trade-off, stated plainly: during a touch peek the finger is pinned to
// the pillar, so the card's scrollable history and voice-playback button
// cannot be reached. On a mouse the pointer can travel onto the card and it
// stays open, so those controls remain usable there.

let hoveredBlockId = null;   // what the card is currently showing
let pointerIsDown = false;   // touch peek in progress
let dragStart = null;        // to tell a drag from a tap/hold

function blockAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);

  const allHits = pillarMeshes.flatMap((p) =>
    p.hitTargets.map((m) => ({ mesh: m, blockId: p.blockId, base: p.base })));
  const intersects = raycaster.intersectObjects(allHits.map((h) => h.mesh));
  if (intersects.length === 0) return null;
  return allHits.find((h) => h.mesh === intersects[0].object) || null;
}

function post(msg) {
  if (window.FlutterBridge) FlutterBridge.postMessage(msg);
  // Web: the same event over postMessage. webview_flutter has no web
  // implementation, so in a browser this page is an iframe and
  // JavaScriptChannel does not exist -- see lib/terrain_embed_web.dart.
  if (window.parent && window.parent !== window) {
    window.parent.postMessage('huluhilir-' + msg, '*');
  }
}

function showBlock(hit) {
  if (hoveredBlockId === hit.blockId) return;   // already showing; do not spam
  hoveredBlockId = hit.blockId;
  controls.autoRotate = false;
  selectionRing.visible = true;
  selectionRing.position.set(hit.base.x, 0.02, hit.base.z);
  post('select:' + hit.blockId);
}

function hideBlock() {
  if (hoveredBlockId === null) return;
  hoveredBlockId = null;
  selectionRing.visible = false;
  post('deselect');
}

function onPointerMove(e) {
  // Mouse hover only. A moving touch is a drag of the camera, and treating it
  // as hover would flicker the card open and shut while orbiting.
  if (e.pointerType === 'touch') return;
  if (pointerIsDown) return;   // mid-drag with a mouse button held
  const hit = blockAt(e.clientX, e.clientY);
  if (hit) {
    showBlock(hit);
    renderer.domElement.style.cursor = 'pointer';
  } else {
    hideBlock();
    renderer.domElement.style.cursor = '';
  }
}

function onPointerDown(e) {
  pointerIsDown = true;
  dragStart = { x: e.clientX, y: e.clientY };
  if (e.pointerType !== 'touch') return;
  const hit = blockAt(e.clientX, e.clientY);
  if (hit) showBlock(hit);
}

function onPointerUp(e) {
  pointerIsDown = false;
  const moved = dragStart
    ? Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y)
    : 0;
  dragStart = null;
  // Releasing always ends a touch peek -- that is the "hands off screen"
  // half of the gesture. On a mouse, releasing after a drag should not close
  // a card the pointer is still resting on, so re-test position instead.
  if (e.pointerType === 'touch') {
    hideBlock();
    return;
  }
  if (moved > 8) return;   // was an orbit drag; leave the card as it is
  const hit = blockAt(e.clientX, e.clientY);
  if (!hit) hideBlock();
}

function onPointerLeave() {
  // Pointer left the canvas entirely.
  pointerIsDown = false;
  dragStart = null;
  hideBlock();
}

window.clearSelection = function () {
  hoveredBlockId = null;
  selectionRing.visible = false;
};

// ---- entry point called from Flutter -----------------------------------------
// payload: { nodes: [{block_id,label,elevation_rank,current_state}],
//            edges: [{from_block_id,to_block_id,flow_weight,barrier}] }
// Web entry point. Android calls window.renderTerrain directly through the
// WebViewController; a browser cannot, so the iframe accepts the same payload
// as a message and forwards it to the identical function. Both platforms
// therefore drive one code path, not two.
window.addEventListener('message', function (event) {
  const data = event.data;
  if (typeof data !== 'string' || data.indexOf('huluhilir-render:') !== 0) return;
  try {
    window.renderTerrain(JSON.parse(data.slice('huluhilir-render:'.length)));
  } catch (err) {
    setStatus('render message failed: ' + err.message);
  }
});

window.renderTerrain = function (payload) {
  currentNodes = payload.nodes || [];
  const edges = payload.edges || [];

  terrainGroup.clear();
  pillarGroup.clear();
  linesGroup.clear();
  pillarMeshes = [];

  if (currentNodes.length === 0) {
    setStatus('no blocks');
    return;
  }

  const ranks = currentNodes.map((n) => n.elevation_rank);
  const minRank = Math.min(...ranks), maxRank = Math.max(...ranks);
  const rankSpan = Math.max(1, maxRank - minRank);

  // Synthetic layout by rank only -- never real lat/lon (huluhilir-rules §4).
  // Nodes sit along a single line radiating from the terrain's centre, with
  // radius strictly monotonic in elevation_rank (highest rank = closest to
  // centre = tallest terrain) so the IDW height field always resolves to a
  // clean centre-high/edge-low gradient. Earlier attempt fanned nodes across
  // an arc at growing radius, which let a lower-ranked node's angular
  // position pull IDW weight away from the centre and produced a spurious
  // second low patch inside the high ring -- see docs/BUILD_LOG.md. The
  // small lateral jitter here is constant-magnitude (not radius-scaled), so
  // it separates pillars visually without perturbing that monotonicity.
  const sortedByRank = [...currentNodes].sort((a, b) => a.elevation_rank - b.elevation_rank);
  const positions = {};
  const n = sortedByRank.length;
  sortedByRank.forEach((node, i) => {
    const t = n === 1 ? 0 : i / (n - 1);
    const heightFrac = 1 - (node.elevation_rank - minRank) / rankSpan;
    const radius = 0.9 + t * 7.4;
    const jitter = (i % 2 === 0 ? -1 : 1) * 0.85;
    positions[node.block_id] = { x: jitter, z: -radius, heightFrac };
  });

  const samples = currentNodes.map((node) => ({
    x: positions[node.block_id].x,
    z: positions[node.block_id].z,
    height: positions[node.block_id].heightFrac * MAX_HEIGHT,
  }));

  const terrainMesh = buildTerrain(samples);
  terrainGroup.add(terrainMesh);

  const basePositions = {};
  for (const node of currentNodes) {
    const p = positions[node.block_id];
    const y = heightAt(samples, p.x, p.z);
    const base = new THREE.Vector3(p.x, y, p.z);
    basePositions[node.block_id] = base;

    const { group, hitTargets } = buildVinePillar({
      label: node.label,
      elevationRank: node.elevation_rank,
      currentState: node.current_state,
    });
    group.position.copy(base);
    pillarGroup.add(group);
    pillarMeshes.push({ group, hitTargets, blockId: node.block_id, base });
  }

  for (const edge of edges) {
    const from = basePositions[edge.from_block_id];
    const to = basePositions[edge.to_block_id];
    if (!from || !to) continue;
    linesGroup.add(buildFlowLine(from, to, edge.flow_weight ?? 0.5, !!edge.barrier));
  }

  selectionRing = buildSelectionRing();
  scene.add(selectionRing);

  setStatus(`rendered ${currentNodes.length} blocks, ${edges.length} edges`);
};

init();
</script>
</body>
</html>
